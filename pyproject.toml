[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plato-imu"
version = "0.1.0"
description = "PLATO: double-adjoint learning of inertial bias dynamics and covariance"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.4,<3", "numpy>=1.26,<3", "scipy>=1.11,<2",
  "tensorboard>=2.16,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
plato-euroc = "mainEurocPLATO:main"
plato-aqualux = "mainAquaLuxPLATO:main"

[tool.setuptools]
packages = ["plato"]
py-modules = ["dataset", "aqualux_dataset", "Interpolation", "lie_algebra", "utils", "network_for_BiadDy", "learning", "evalutation", "mainEurocPLATO", "mainAquaLuxPLATO"]
include-package-data = false
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "external/Debias_IMU/LICENSE"]

[tool.setuptools.package-dir]
"" = "external/Debias_IMU/BiasDy"


[tool.pytest.ini_options]
testpaths = ["tests", "external/Debias_IMU/BiasDy/plato"]
python_files = ["test_*.py", "*_smoke_test.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
