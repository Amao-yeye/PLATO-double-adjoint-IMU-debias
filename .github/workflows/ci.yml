name: Numerical verification
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      - run: bash scripts/smoke_test.sh --skip-data
      - run: python tools/build_release.py
      - run: python -m pip wheel --no-deps . --wheel-dir dist
